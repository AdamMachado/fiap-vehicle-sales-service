name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  IMAGE_NAME: ghcr.io/adammachado/fiap-vehicle-sales-api

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $CONFIGURATION --no-restore

      - name: Test
        run: dotnet test --configuration $CONFIGURATION --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build Docker image
        run: docker compose build vehicle-sales-api

  compose-deploy-validation:
    name: compose-deploy-validation
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Start local stack
        run: docker compose up -d --build

      - name: Wait for API
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/vehicles/available > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "API did not become ready in time."
          exit 1

      - name: Validate Keycloak authentication
        shell: bash
        run: |
          for attempt in {1..30}; do
            if token_response="$(
              curl --fail --silent \
                --request POST \
                --url http://localhost:8080/realms/fiap-vehicle-sales/protocol/openid-connect/token \
                --header "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "client_id=vehicle-sales-api" \
                --data-urlencode "username=buyer@test.com" \
                --data-urlencode "password=123456" \
                --data-urlencode "grant_type=password"
            )" && echo "$token_response" | jq --exit-status '.access_token | length > 0' > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Keycloak authentication did not become ready in time."
          exit 1

      - name: Show running containers
        if: always()
        run: docker compose ps -a

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-image:
    name: publish-image
    runs-on: ubuntu-latest
    needs: compose-deploy-validation
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --file src/Fiap.VehicleSales.Api/Dockerfile --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Publish Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
