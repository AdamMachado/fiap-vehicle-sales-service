apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-sales-api
  namespace: vehicle-sales
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-sales-api
  template:
    metadata:
      labels:
        app: vehicle-sales-api
    spec:
      containers:
        - name: api
          image: ghcr.io/adammachado/fiap-vehicle-sales-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vehicle-sales-api-config
          env:
            - name: ConnectionStrings__VehicleSalesDb
              valueFrom:
                secretKeyRef:
                  name: vehicle-sales-secrets
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-sales-api
  namespace: vehicle-sales
spec:
  selector:
    app: vehicle-sales-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
