services:
  vehicle-sales-api:
    build:
      context: .
      dockerfile: src/Fiap.VehicleSales.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__VehicleSalesDb: Host=vehicle-sales-db;Port=5432;Database=vehicle_sales_db;Username=postgres;Password=postgres
      Keycloak__Authority: http://localhost:8080/realms/fiap-vehicle-sales
      Keycloak__MetadataAddress: http://keycloak:8080/realms/fiap-vehicle-sales/.well-known/openid-configuration
      Keycloak__Audience: vehicle-sales-api
    ports:
      - "5000:8080"
    depends_on:
      vehicle-sales-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - vehicle-sales-network

  vehicle-sales-db:
    image: postgres:16
    environment:
      POSTGRES_DB: vehicle_sales_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehicle_sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehicle-sales-network

  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehicle-sales-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./config/keycloak/fiap-vehicle-sales-realm.json:/opt/keycloak/data/import/fiap-vehicle-sales-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - vehicle-sales-network

volumes:
  vehicle_sales_data:
  keycloak_data:

networks:
  vehicle-sales-network:
    driver: bridge
